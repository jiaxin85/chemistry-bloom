:#7255ae;font-weight:750;padding:7px 0}.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}.crumb{border:0;background:transparent;color:#755cb3;font-weight:700;padding:7px 0}.detail-title{font-size:clamp(1.7rem,4vw,2.5rem);margin:8px 0 4px;letter-spacing:-.055em}.detail-sub{color:var(--muted);margin:0 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid var(--border);border-radius:16px;padding:10px 15px;background:white;color:var(--muted);font-weight:700}.tab.active{background:var(--lilac);color:#6248a1;border-color:#d6c4f4}.note{padding:24px}.note h3{margin:0 0 13px}.note ul{padding-left:22px}.note li{margin:10px 0}.tip{background:var(--cream);border-radius:16px;padding:15px;margin-top:17px}.question-card,.structured-card{padding:22px;margin-bottom:15px}.qmeta{font-size:.75rem;color:#795cae;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.question-card h3,.structured-card h3{font-size:1.06rem;margin:9px 0 17px;letter-spacing:-.01em}.choices{display:grid;gap:9px}.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid #e8e2f0;border-radius:13px;padding:12px 14px;background:#fff;color:var(--ink);width:100%;transition:background .1s}.choice:hover{background:#faf6ff}.choice.selected{border-color:#a68bdf;background:#f4edff}.choice.correct{border-color:#6eb99c;background:#e6f8ef}.choice.incorrect{border-color:#e2a0ab;background:#fff0f2}.letter{display:grid;place-items:center;background:#f2eafa;border-radius:9px;flex:0 0 24px;height:24px;color:#7455af;font-size:.78rem;font-weight:800}.feedback{margin-top:14px;padding:14px;border-radius:14px;background:#f3eefb;font-size:.9rem}.feedback.good{background:#e7f7ef}.feedback.bad{background:#fff0f2}.quiz-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--border);background:#fff;border-radius:19px;padding:14px 18px;margin-bottom:16px}.q
